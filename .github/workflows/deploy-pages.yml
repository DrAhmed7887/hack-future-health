name: deploy-pages
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_run:
    workflows: [refresh-live-forecast]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # the refresh job's newest commit
      - name: Site files only (no tests, no raw data)
        run: |
          mkdir -p _site/data
          cp web/index.html web/style.css web/logic.js web/app.js _site/
          cp web/data/live.json web/data/replay.json web/data/evidence.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
