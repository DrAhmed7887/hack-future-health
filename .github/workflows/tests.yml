name: tests
on:
  push: {}
  pull_request: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/tests/logic.test.js
